# netlify.toml

[build]
  # ... your build settings ...

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# UPDATED Redirect rule:
# Match any request starting with /3/ and proxy it to the function.
# The :splat will capture everything *after* the /3/
# e.g., /3/search/tv?query=... -> :splat becomes search/tv?query=...
# IMPORTANT: This assumes you don't have legitimate static files under a /3/ path.
# If you do, this rule might capture them incorrectly unless `force=true` is carefully considered
# or more specific rules are added *before* this one.
[[redirects]]
  from = "/3/*"                             # Match paths starting with /3/
  to = "/.netlify/functions/tmdb-proxy/:splat" # Proxy to the function
  status = 200                              # Proxy status
  force = true                              # Ensure this rule takes precedence over potential file serving under /3/
